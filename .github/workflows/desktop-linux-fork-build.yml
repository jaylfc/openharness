name: Desktop Linux fork build

# An unsigned Linux AppImage of any branch, for a tester on a machine this repository's own release
# cannot reach. Not a release: nothing is uploaded to a bucket, no manifest is written, no tag is made.
# The AppImage is a run artifact (kept 14 days), so it needs no cloud credentials at all.
#
#   git push fork HEAD:omarchy-fix                        # builds x64
#   Actions -> Desktop Linux fork build -> Run workflow   # pick the branch and the architecture
#
# Built by the release's own packaging (scripts/upload-desktop-linux.sh, Step 3): the Flutter bundle
# verbatim under usr/bin, AppRun a symlink to the executable, version.txt beside it. That script also
# publishes, so the packaging half is repeated here rather than run.
#
# Self-update is pinned OFF the way desktop-internal-build.yml pins it: DESKTOP_UPDATE_METADATA_URL
# names a manifest nothing ever writes, so the updater finds nothing, forever, and the build is never
# replaced by a public release. The stamped version is above any published one as a second guard.

on:
  push:
    branches: ['omarchy-fix']
  workflow_dispatch:
    inputs:
      arch:
        description: 'Architecture to build'
        type: choice
        options: [x64, arm64]
        default: x64

permissions:
  contents: read

env:
  # Kept in step with release-desktop.yml, whose pin is the toolchain releases are built with.
  FLUTTER_VERSION: '3.47.2'
  STAMPED_VERSION: '1.2.99'

jobs:
  build-linux:
    runs-on: ${{ (inputs.arch || 'x64') == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 45
    env:
      BUILD_ARCH: ${{ inputs.arch || 'x64' }}   # a push has no inputs: it builds x64
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7

      - name: Install the Linux desktop toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - uses: subosito/flutter-action@v2
        if: env.BUILD_ARCH != 'arm64'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Flutter publishes no linux-arm64 SDK archive; see release-desktop.yml.
      - name: Install Flutter from git (arm64 has no published archive)
        if: env.BUILD_ARCH == 'arm64'
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$FLUTTER_VERSION" \
            https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - run: |
          flutter --version
          flutter precache --linux
          flutter pub get

      - name: Build
        run: |
          flutter build linux --release \
            --dart-define=DESKTOP_UPDATE_METADATA_URL="https://storage.googleapis.com/s3-autonomous-upgrade-3/harness/desktop-internal/no-updates.json"

      - name: Package the AppImage
        env:
          ARCH_NAME: ${{ env.BUILD_ARCH }}
          APPIMAGETOOL_VERSION: '1.9.1'
        run: |
          set -euo pipefail
          appimage_arch="$([ "$ARCH_NAME" = arm64 ] && echo aarch64 || echo x86_64)"
          curl -fL "https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/appimagetool-${appimage_arch}.AppImage" \
            -o "$RUNNER_TEMP/appimagetool"
          chmod +x "$RUNNER_TEMP/appimagetool"
          bundle="build/linux/${ARCH_NAME}/release/bundle"
          [ -x "$bundle/harness" ] || { echo "::error::no harness executable in $bundle"; exit 1; }
          echo "$STAMPED_VERSION" > "$bundle/version.txt"
          appdir="$RUNNER_TEMP/AppDir"
          mkdir -p "$appdir/usr/bin"
          cp -a "$bundle/." "$appdir/usr/bin/"
          ln -s usr/bin/harness "$appdir/AppRun"
          cp "$bundle/harness.png" "$appdir/harness.png"
          cat > "$appdir/harness.desktop" <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=Harness
          Comment=Attach terminals to the agents running on your Harness machines
          Exec=harness
          Icon=harness
          Categories=Development;
          Terminal=false
          DESKTOP
          mkdir -p "$RUNNER_TEMP/out"
          out="$RUNNER_TEMP/out/Harness-linux-${ARCH_NAME}-fork.AppImage"
          ARCH="$appimage_arch" "$RUNNER_TEMP/appimagetool" --appimage-extract-and-run "$appdir" "$out"
          chmod +x "$out"
          file "$out"
          sha256sum "$out"
          echo "APPIMAGE=$out" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: Harness-linux-${{ env.BUILD_ARCH }}-fork
          path: ${{ env.APPIMAGE }}
          retention-days: 14
          if-no-files-found: error
